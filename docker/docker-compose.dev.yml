version: "3.8"

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: polaris-postgres
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris_dev
    ports:
      - "5432:5432"
    volumes:
      - polaris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - polaris-net

  # Development build container (auto-detects platform)
  polaris-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.unified
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
      # Auto-detect platform: buildx will use the host architecture
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: polaris-dev
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      # Override DB connection to use Docker network
      POLARIS_DB_HOST: postgres
      POLARIS_DB_PORT: 5432
      # Enable ccache
      CCACHE_DIR: /home/builder/.ccache
    volumes:
      # Mount source code
      - ..:/workspace:rw
      # Persistent ccache
      - polaris_ccache:/home/builder/.ccache
      # Persistent build directory (speeds up rebuilds)
      - polaris_build:/workspace/build
    working_dir: /workspace
    ports:
      - "50051:50051"  # gRPC
      - "8080:8080"    # HTTP/REST
      - "9100:9100"    # Prometheus metrics
    networks:
      - polaris-net
    # Keep container running for development
    command: tail -f /dev/null
    stdin_open: true
    tty: true

networks:
  polaris-net:
    driver: bridge

volumes:
  polaris_pgdata:
  polaris_ccache:
  polaris_build:
